<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 584" width="960" height="584" font-family="Segoe UI, Arial, sans-serif">
  <title>EventMind runtime sequence</title>
  <desc>How a message travels between the browser, the small server, the engine, the model API and the saved state, drawn one arrow at a time.</desc>
  <defs><marker id="m" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#1b231d"/></marker></defs>
  <rect width="960" height="584" rx="22" fill="#f3f7f3"/>
  <text x="480" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1b231d">Runtime sequence: what happens when you press Process message</text>
  <text x="480" y="48" text-anchor="middle" font-size="11.5" fill="#5b6a5f">solid arrows are calls, dashed arrows are replies; the diagram redraws itself in a loop</text>
  <rect x="38" y="64" width="124" height="34" rx="10" fill="#3b78c4"/><text x="100" y="86" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">Browser UI</text>
  <line x1="100" y1="98" x2="100" y2="570" stroke="#c9d1c9" stroke-width="2" stroke-dasharray="4 5"/>
  <rect x="238" y="64" width="124" height="34" rx="10" fill="#7d8a80"/><text x="300" y="86" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">serve.py</text>
  <line x1="300" y1="98" x2="300" y2="570" stroke="#c9d1c9" stroke-width="2" stroke-dasharray="4 5"/>
  <rect x="458" y="64" width="124" height="34" rx="10" fill="#2f9e55"/><text x="520" y="86" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">eventmind.py</text>
  <line x1="520" y1="98" x2="520" y2="570" stroke="#c9d1c9" stroke-width="2" stroke-dasharray="4 5"/>
  <rect x="658" y="64" width="124" height="34" rx="10" fill="#5b5bd6"/><text x="720" y="86" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">Model API</text>
  <line x1="720" y1="98" x2="720" y2="570" stroke="#c9d1c9" stroke-width="2" stroke-dasharray="4 5"/>
  <rect x="818" y="64" width="124" height="34" rx="10" fill="#b26a00"/><text x="880" y="86" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">out/state.json</text>
  <line x1="880" y1="98" x2="880" y2="570" stroke="#c9d1c9" stroke-width="2" stroke-dasharray="4 5"/>
  <line x1="100" y1="128" x2="294" y2="128" stroke="#1b231d" stroke-width="2" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1" marker-end="url(#m)"><animate attributeName="stroke-dashoffset" dur="22s" repeatCount="indefinite" keyTimes="0;0.0303;0.0653;0.97;0.985;1" values="1;1;0;0;1;1"/></line>
  <text x="200.0" y="120" text-anchor="middle" font-size="11.5" fill="#1b231d" opacity="0"><animate attributeName="opacity" dur="22s" repeatCount="indefinite" keyTimes="0;0.0303;0.0653;0.97;0.985;1" values="0;0;1;1;0;0"/>1. POST /api/message (text or file)</text>
  <line x1="300" y1="164" x2="514" y2="164" stroke="#1b231d" stroke-width="2" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1" marker-end="url(#m)"><animate attributeName="stroke-dashoffset" dur="22s" repeatCount="indefinite" keyTimes="0;0.1061;0.1411;0.97;0.985;1" values="1;1;0;0;1;1"/></line>
  <text x="410.0" y="156" text-anchor="middle" font-size="11.5" fill="#1b231d" opacity="0"><animate attributeName="opacity" dur="22s" repeatCount="indefinite" keyTimes="0;0.1061;0.1411;0.97;0.985;1" values="0;0;1;1;0;0"/>2. run: python eventmind.py &lt;file&gt;</text>
  <path d="M520 190 h46 v20 h-46" fill="none" stroke="#1b231d" stroke-width="2" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1" marker-end="url(#m)"><animate attributeName="stroke-dashoffset" dur="22s" repeatCount="indefinite" keyTimes="0;0.1818;0.2168;0.97;0.985;1" values="1;1;0;0;1;1"/></path>
  <text x="574" y="204" text-anchor="start" font-size="11.5" fill="#1b231d" opacity="0"><animate attributeName="opacity" dur="22s" repeatCount="indefinite" keyTimes="0;0.1818;0.2168;0.97;0.985;1" values="0;0;1;1;0;0"/>3. redact personal data, keep only new text</text>
  <line x1="520" y1="236" x2="714" y2="236" stroke="#1b231d" stroke-width="2" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1" marker-end="url(#m)"><animate attributeName="stroke-dashoffset" dur="22s" repeatCount="indefinite" keyTimes="0;0.2576;0.2926;0.97;0.985;1" values="1;1;0;0;1;1"/></line>
  <text x="620.0" y="228" text-anchor="middle" font-size="11.5" fill="#1b231d" opacity="0"><animate attributeName="opacity" dur="22s" repeatCount="indefinite" keyTimes="0;0.2576;0.2926;0.97;0.985;1" values="0;0;1;1;0;0"/>4. ONE reading call (fixed schema prompt)</text>
  <line x1="720" y1="272" x2="526" y2="272" stroke="#5b6a5f" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#m)" opacity="0"><animate attributeName="opacity" dur="22s" repeatCount="indefinite" keyTimes="0;0.3333;0.3683;0.97;0.985;1" values="0;0;1;1;0;0"/></line>
  <text x="620.0" y="264" text-anchor="middle" font-size="11.5" fill="#1b231d" opacity="0"><animate attributeName="opacity" dur="22s" repeatCount="indefinite" keyTimes="0;0.3333;0.3683;0.97;0.985;1" values="0;0;1;1;0;0"/>5. JSON facts + token usage</text>
  <path d="M520 298 h46 v20 h-46" fill="none" stroke="#1b231d" stroke-width="2" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1" marker-end="url(#m)"><animate attributeName="stroke-dashoffset" dur="22s" repeatCount="indefinite" keyTimes="0;0.4091;0.4441;0.97;0.985;1" values="1;1;0;0;1;1"/></path>
  <text x="574" y="312" text-anchor="start" font-size="11.5" fill="#1b231d" opacity="0"><animate attributeName="opacity" dur="22s" repeatCount="indefinite" keyTimes="0;0.4091;0.4441;0.97;0.985;1" values="0;0;1;1;0;0"/>6. resolve, plan, validate, reject loop (code)</text>
  <line x1="520" y1="344" x2="874" y2="344" stroke="#1b231d" stroke-width="2" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1" marker-end="url(#m)"><animate attributeName="stroke-dashoffset" dur="22s" repeatCount="indefinite" keyTimes="0;0.4848;0.5198;0.97;0.985;1" values="1;1;0;0;1;1"/></line>
  <text x="700.0" y="336" text-anchor="middle" font-size="11.5" fill="#1b231d" opacity="0"><animate attributeName="opacity" dur="22s" repeatCount="indefinite" keyTimes="0;0.4848;0.5198;0.97;0.985;1" values="0;0;1;1;0;0"/>7. save plan, trace, pipeline</text>
  <line x1="520" y1="380" x2="306" y2="380" stroke="#5b6a5f" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#m)" opacity="0"><animate attributeName="opacity" dur="22s" repeatCount="indefinite" keyTimes="0;0.5606;0.5956;0.97;0.985;1" values="0;0;1;1;0;0"/></line>
  <text x="410.0" y="372" text-anchor="middle" font-size="11.5" fill="#1b231d" opacity="0"><animate attributeName="opacity" dur="22s" repeatCount="indefinite" keyTimes="0;0.5606;0.5956;0.97;0.985;1" values="0;0;1;1;0;0"/>8. exit code 0</text>
  <line x1="300" y1="416" x2="106" y2="416" stroke="#5b6a5f" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#m)" opacity="0"><animate attributeName="opacity" dur="22s" repeatCount="indefinite" keyTimes="0;0.6364;0.6714;0.97;0.985;1" values="0;0;1;1;0;0"/></line>
  <text x="200.0" y="408" text-anchor="middle" font-size="11.5" fill="#1b231d" opacity="0"><animate attributeName="opacity" dur="22s" repeatCount="indefinite" keyTimes="0;0.6364;0.6714;0.97;0.985;1" values="0;0;1;1;0;0"/>9. { ok: true }</text>
  <line x1="100" y1="452" x2="294" y2="452" stroke="#1b231d" stroke-width="2" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1" marker-end="url(#m)"><animate attributeName="stroke-dashoffset" dur="22s" repeatCount="indefinite" keyTimes="0;0.7121;0.7471;0.97;0.985;1" values="1;1;0;0;1;1"/></line>
  <text x="200.0" y="444" text-anchor="middle" font-size="11.5" fill="#1b231d" opacity="0"><animate attributeName="opacity" dur="22s" repeatCount="indefinite" keyTimes="0;0.7121;0.7471;0.97;0.985;1" values="0;0;1;1;0;0"/>10. GET /state.json (every 3 s)</text>
  <line x1="300" y1="488" x2="106" y2="488" stroke="#5b6a5f" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#m)" opacity="0"><animate attributeName="opacity" dur="22s" repeatCount="indefinite" keyTimes="0;0.7879;0.8229;0.97;0.985;1" values="0;0;1;1;0;0"/></line>
  <text x="200.0" y="480" text-anchor="middle" font-size="11.5" fill="#1b231d" opacity="0"><animate attributeName="opacity" dur="22s" repeatCount="indefinite" keyTimes="0;0.7879;0.8229;0.97;0.985;1" values="0;0;1;1;0;0"/>11. state.json</text>
  <path d="M100 514 h46 v20 h-46" fill="none" stroke="#1b231d" stroke-width="2" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1" marker-end="url(#m)"><animate attributeName="stroke-dashoffset" dur="22s" repeatCount="indefinite" keyTimes="0;0.8636;0.8986;0.97;0.985;1" values="1;1;0;0;1;1"/></path>
  <text x="154" y="528" text-anchor="start" font-size="11.5" fill="#1b231d" opacity="0"><animate attributeName="opacity" dur="22s" repeatCount="indefinite" keyTimes="0;0.8636;0.8986;0.97;0.985;1" values="0;0;1;1;0;0"/>12. render cards, strip, trace; go to Plan page</text>
</svg>
