<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330" font-family="Segoe UI, Arial, sans-serif">
  <title>EventMind pipeline: a message travels through the agents</title>
  <desc>A message packet moves left to right through the redactor, the reader model, the resolver, the planner and the validator. If a check fails the rejector removes the newest lower-authority fact and the planner runs again.</desc>
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#7d8a80"/></marker>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#143a1e" flood-opacity="0.18"/></filter>
  </defs>
  <rect width="960" height="330" rx="22" fill="#eef4ee"/>
  <text x="480" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1b231d">One message, start to finish</text>
  <text x="480" y="54" text-anchor="middle" font-size="12" fill="#5b6a5f">a model reads the language, plain code decides everything else</text>

  <!-- track -->
  <line x1="72" y1="140" x2="888" y2="140" stroke="#cfd9cf" stroke-width="4" stroke-linecap="round"/>

  <!-- nodes: x = 16 + i*136, width 112 -->
  <g filter="url(#sh)">
    <rect x="16"  y="104" width="112" height="72" rx="14" fill="#ffffff" stroke="#7d8a80" stroke-width="1.5">
      <animate attributeName="fill" dur="14s" repeatCount="indefinite" keyTimes="0;0.02;0.06;0.14;0.17;1" values="#ffffff;#ffffff;#dff3e4;#dff3e4;#ffffff;#ffffff"/></rect>
    <rect x="152" y="104" width="112" height="72" rx="14" fill="#ffffff" stroke="#5cc777" stroke-width="2">
      <animate attributeName="fill" dur="14s" repeatCount="indefinite" keyTimes="0;0.14;0.18;0.26;0.29;1" values="#ffffff;#ffffff;#dff3e4;#dff3e4;#ffffff;#ffffff"/></rect>
    <rect x="288" y="104" width="112" height="72" rx="14" fill="#ffffff" stroke="#8c8cf5" stroke-width="2.5">
      <animate attributeName="fill" dur="14s" repeatCount="indefinite" keyTimes="0;0.27;0.31;0.43;0.46;1" values="#ffffff;#ffffff;#e4e4fd;#e4e4fd;#ffffff;#ffffff"/></rect>
    <rect x="424" y="104" width="112" height="72" rx="14" fill="#ffffff" stroke="#5cc777" stroke-width="2">
      <animate attributeName="fill" dur="14s" repeatCount="indefinite" keyTimes="0;0.44;0.48;0.56;0.59;1" values="#ffffff;#ffffff;#dff3e4;#dff3e4;#ffffff;#ffffff"/></rect>
    <rect x="560" y="104" width="112" height="72" rx="14" fill="#ffffff" stroke="#5cc777" stroke-width="2">
      <animate attributeName="fill" dur="14s" repeatCount="indefinite" keyTimes="0;0.57;0.61;0.69;0.72;1" values="#ffffff;#ffffff;#dff3e4;#dff3e4;#ffffff;#ffffff"/></rect>
    <rect x="696" y="104" width="112" height="72" rx="14" fill="#ffffff" stroke="#5cc777" stroke-width="2">
      <animate attributeName="fill" dur="14s" repeatCount="indefinite" keyTimes="0;0.70;0.74;0.82;0.85;1" values="#ffffff;#ffffff;#dff3e4;#dff3e4;#ffffff;#ffffff"/></rect>
    <rect x="832" y="104" width="112" height="72" rx="14" fill="#ffffff" stroke="#1b231d" stroke-width="2">
      <animate attributeName="fill" dur="14s" repeatCount="indefinite" keyTimes="0;0.84;0.88;0.96;0.99;1" values="#ffffff;#ffffff;#dff3e4;#dff3e4;#ffffff;#ffffff"/></rect>
  </g>

  <!-- labels -->
  <g text-anchor="middle" fill="#1b231d">
    <text x="72"  y="136" font-size="14" font-weight="700">Message</text><text x="72"  y="154" font-size="11" fill="#5b6a5f">text, email, file</text>
    <text x="208" y="136" font-size="14" font-weight="700">Redactor</text><text x="208" y="154" font-size="11" fill="#5b6a5f">removes personal data</text>
    <text x="344" y="136" font-size="14" font-weight="700">Reader</text><text x="344" y="154" font-size="11" fill="#5b6a5f">any language to JSON</text>
    <text x="480" y="136" font-size="14" font-weight="700">Resolver</text><text x="480" y="154" font-size="11" fill="#5b6a5f">newest + authority wins</text>
    <text x="616" y="136" font-size="14" font-weight="700">Planner</text><text x="616" y="154" font-size="11" fill="#5b6a5f">best plan, exact sums</text>
    <text x="752" y="136" font-size="14" font-weight="700">Validator</text><text x="752" y="154" font-size="11" fill="#5b6a5f">every rule checked</text>
    <text x="888" y="136" font-size="14" font-weight="700">Plan + UI</text><text x="888" y="154" font-size="11" fill="#5b6a5f">cards, trace, files</text>
  </g>
  <!-- kind badges -->
  <g font-size="10" font-weight="700" text-anchor="middle">
    <rect x="42" y="84" width="60" height="18" rx="9" fill="#dbe7f7"/><text x="72" y="97" fill="#3b78c4">FILE</text>
    <rect x="178" y="84" width="60" height="18" rx="9" fill="#dff3e4"/><text x="208" y="97" fill="#2f9e55">CODE</text>
    <rect x="314" y="84" width="60" height="18" rx="9" fill="#e4e4fd"/><text x="344" y="97" fill="#5b5bd6">MODEL</text>
    <rect x="450" y="84" width="60" height="18" rx="9" fill="#dff3e4"/><text x="480" y="97" fill="#2f9e55">CODE</text>
    <rect x="586" y="84" width="60" height="18" rx="9" fill="#dff3e4"/><text x="616" y="97" fill="#2f9e55">CODE</text>
    <rect x="722" y="84" width="60" height="18" rx="9" fill="#dff3e4"/><text x="752" y="97" fill="#2f9e55">CODE</text>
    <rect x="858" y="84" width="60" height="18" rx="9" fill="#dbe7f7"/><text x="888" y="97" fill="#3b78c4">UI</text>
  </g>

  <!-- optional rule checker above the resolver/planner gap -->
  <g>
    <rect x="388" y="196" width="176" height="44" rx="12" fill="#f4f4ff" stroke="#8c8cf5" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="476" y="214" text-anchor="middle" font-size="12" font-weight="700" fill="#5b5bd6">Rule checker (MODEL)</text>
    <text x="476" y="230" text-anchor="middle" font-size="10.5" fill="#5b6a5f">only for rules the code cannot judge</text>
    <line x1="480" y1="176" x2="480" y2="196" stroke="#8c8cf5" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arr)"/>
  </g>

  <!-- rejection loop -->
  <path d="M752 176 C752 262 616 262 616 176" fill="none" stroke="#ef6b5e" stroke-width="2.2" stroke-dasharray="7 6" marker-end="url(#arr)">
    <animate attributeName="stroke-dashoffset" from="0" to="-26" dur="1.4s" repeatCount="indefinite"/>
  </path>
  <rect x="598" y="262" width="172" height="46" rx="12" fill="#fdeceb" stroke="#ef6b5e" stroke-width="1.5"/>
  <text x="684" y="281" text-anchor="middle" font-size="12" font-weight="700" fill="#c0392b">Rejector</text>
  <text x="684" y="297" text-anchor="middle" font-size="10.5" fill="#7a3a33">a check fails: drop newest lower-authority fact, re-plan</text>

  <!-- the travelling message packet -->
  <circle r="11" fill="#5cc777" stroke="#ffffff" stroke-width="3">
    <animateMotion dur="14s" repeatCount="indefinite" path="M72,140 L888,140" keyPoints="0;0.0;1;1" keyTimes="0;0.02;0.97;1" calcMode="linear"/>
    <animate attributeName="fill" dur="14s" repeatCount="indefinite" keyTimes="0;0.27;0.31;0.43;0.46;1" values="#5cc777;#5cc777;#8c8cf5;#8c8cf5;#5cc777;#5cc777"/>
  </circle>
  <text x="480" y="322" text-anchor="middle" font-size="10.5" fill="#7d8a80">the packet turns purple while the model is reading</text>
</svg>
